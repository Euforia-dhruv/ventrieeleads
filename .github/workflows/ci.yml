name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Backend Lint ─────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format

  # ── Backend Type Check ───────────────────────────────────────
  typecheck-backend:
    name: Type Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  # ── Frontend Lint ────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format

  # ── Frontend Type Check ──────────────────────────────────────
  typecheck-frontend:
    name: Type Check Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  # ── Backend Unit Tests ───────────────────────────────────────
  unit-tests-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    needs: [lint-backend, typecheck-backend]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_leads
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_leads
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-for-ci
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 4
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: psql "$DATABASE_URL" -f init.sql

      - name: Run unit tests
        run: npx jest --testPathPattern='tests/.*\.test\.ts$' --coverage --coverageReporters=text --coverageReporters=lcov --forceExit --detectOpenHandles

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ── Integration Tests ────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-backend, typecheck-backend]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_leads
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_leads
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-for-ci
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 4
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: psql "$DATABASE_URL" -f init.sql

      - name: Run integration tests
        run: npx jest --testPathPattern='tests/.*integration.*\.test\.ts$' --forceExit --detectOpenHandles

  # ── Python Worker Tests ──────────────────────────────────────
  python-tests:
    name: Python Tests (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest tests/ ../tests/test_integration.py -q

  # ── Build Verification ───────────────────────────────────────
  build-backend:
    name: Build Backend (Docker)
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t leads-backend:ci-${{ github.sha }} -f backend/Dockerfile.typescript .

  build-frontend:
    name: Build Frontend (Docker)
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t leads-frontend:ci-${{ github.sha }} -f frontend/Dockerfile .

  # ── Security Scans ───────────────────────────────────────────
  security-scan-backend:
    name: Security Scan (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: npm audit (all)
        run: npm audit --audit-level=critical
        continue-on-error: true

  security-scan-frontend:
    name: Security Scan (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: npm audit (all)
        run: npm audit --audit-level=critical
        continue-on-error: true

  # ── CI Summary ───────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [
      lint-backend, typecheck-backend,
      lint-frontend, typecheck-frontend,
      unit-tests-backend, integration-tests, python-tests,
      build-backend, build-frontend,
      security-scan-backend, security-scan-frontend
    ]
    if: always()
    steps:
      - name: Check for failures
        run: |
          results=(
            "${{ needs.lint-backend.result }}"
            "${{ needs.typecheck-backend.result }}"
            "${{ needs.lint-frontend.result }}"
            "${{ needs.typecheck-frontend.result }}"
            "${{ needs.unit-tests-backend.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.python-tests.result }}"
            "${{ needs.build-backend.result }}"
            "${{ needs.build-frontend.result }}"
          )

          failed=false
          for result in "${results[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=true
              break
            fi
          done

          echo "=== CI Results ==="
          echo "Lint Backend:         ${{ needs.lint-backend.result }}"
          echo "Type Check Backend:   ${{ needs.typecheck-backend.result }}"
          echo "Lint Frontend:        ${{ needs.lint-frontend.result }}"
          echo "Type Check Frontend:  ${{ needs.typecheck-frontend.result }}"
          echo "Unit Tests Backend:   ${{ needs.unit-tests-backend.result }}"
          echo "Integration Tests:    ${{ needs.integration-tests.result }}"
          echo "Python Tests Worker:  ${{ needs.python-tests.result }}"
          echo "Build Backend:        ${{ needs.build-backend.result }}"
          echo "Build Frontend:       ${{ needs.build-frontend.result }}"

          if [ "$failed" = "true" ]; then
            echo ""
            echo "CI pipeline failed."
            exit 1
          fi

          echo ""
          echo "All CI checks passed."
