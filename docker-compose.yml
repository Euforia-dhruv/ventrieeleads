services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - BACKEND_INTERNAL_URL=http://backend:8000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.typescript
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - DOMAIN=ventrieeleads.qd.je
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - TASK_ENQUEUER_URL=http://task-enqueuer:8002
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000,https://ventrieeleads.qd.je}
      - LOG_LEVEL=info
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - PORT=8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  task-enqueuer:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    command: python3 -m worker.enqueue_server
    expose:
      - "8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8002
      - TIMEZONE=${TIMEZONE:-UTC}
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      # AI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lightpanda:
    image: lightpanda/browser:nightly
    command: lightpanda serve --host 0.0.0.0 --port 9222 --log-level warn
    expose:
      - "8080"
      - "9222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9222/json/version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4 -Q scrape,audit,process,celery
    environment:
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      - REDIS_URL=redis://redis:6379
      - SCREENSHOTS_DIR=/app/data/screenshots
      - LOG_LEVEL=info
      - TIMEZONE=${TIMEZONE:-UTC}
      # AI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-}
      # Provider API Keys (Free tiers)
      - OUTSCRAPER_API_KEY=${OUTSCRAPER_API_KEY}
      - APOLLO_API_KEY=${APOLLO_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - BUILTWITH_API_KEY=${BUILTWITH_API_KEY}
      - WAPPALYZER_API_KEY=${WAPPALYZER_API_KEY}
      - CALENDLY_API_KEY=${CALENDLY_API_KEY}
      - LOOM_API_KEY=${LOOM_API_KEY}
      # Browser
      - LIGHTPANDA_URL=${LIGHTPANDA_URL:-http://lightpanda:8080}
      - LIGHTPANDA_CDP_URL=${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}
      - BROWSER_FALLBACK_CHAIN=${BROWSER_FALLBACK_CHAIN:-lightpanda,playwright,http}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_started
    volumes:
      - leads-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-search:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2 -Q search
    environment:
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      - REDIS_URL=redis://redis:6379
      # AI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-}
      - AI_FALLBACK_ENABLED=${AI_FALLBACK_ENABLED:-true}
      - LOG_LEVEL=info
      - TIMEZONE=${TIMEZONE:-UTC}
      # Provider API Keys (Free tiers)
      - OUTSCRAPER_API_KEY=${OUTSCRAPER_API_KEY}
      - APOLLO_API_KEY=${APOLLO_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - BUILTWITH_API_KEY=${BUILTWITH_API_KEY}
      - WAPPALYZER_API_KEY=${WAPPALYZER_API_KEY}
      - CALENDLY_API_KEY=${CALENDLY_API_KEY}
      - LOOM_API_KEY=${LOOM_API_KEY}
      # Browser
      - LIGHTPANDA_URL=${LIGHTPANDA_URL:-http://lightpanda:8080}
      - LIGHTPANDA_CDP_URL=${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}
      - BROWSER_FALLBACK_CHAIN=${BROWSER_FALLBACK_CHAIN:-lightpanda,playwright,http}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-research:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2 -Q research
    environment:
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      - REDIS_URL=redis://redis:6379
      # AI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-}
      - AI_FALLBACK_ENABLED=${AI_FALLBACK_ENABLED:-true}
      - LOG_LEVEL=info
      - TIMEZONE=${TIMEZONE:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://leads:leads_pass@postgres:5432/leads
      - REDIS_URL=redis://redis:6379
      - TIMEZONE=${TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/phase2_migration.sql:/docker-entrypoint-initdb.d/02-phase2.sql
      - ./backend/phase3_migration.sql:/docker-entrypoint-initdb.d/03-phase3.sql
      - ./backend/phase5_migration.sql:/docker-entrypoint-initdb.d/04-phase5.sql
      - ./backend/phase6_migration.sql:/docker-entrypoint-initdb.d/05-phase6.sql
      - ./backend/migration_modules.sql:/docker-entrypoint-initdb.d/06-modules.sql
      - ./backend/migration_locations_industries.sql:/docker-entrypoint-initdb.d/07-locations.sql
      - ./backend/migration_intelligence.sql:/docker-entrypoint-initdb.d/08-intelligence.sql
      - ./backend/migration_discovery_orchestrator.sql:/docker-entrypoint-initdb.d/09-discovery.sql
      - ./backend/migration_auth.sql:/docker-entrypoint-initdb.d/10-auth.sql
      - ./backend/migration_notifications.sql:/docker-entrypoint-initdb.d/11-notifications.sql
      - ./backend/migration_data_protection.sql:/docker-entrypoint-initdb.d/12-data-protection.sql
      - ./backend/seed_locations_industries.sql:/docker-entrypoint-initdb.d/13-seed-data.sql
      - ./backend/migration_fix_agent_tables.sql:/docker-entrypoint-initdb.d/14-fix-agent-tables.sql
      - ./backend/phase7_migration.sql:/docker-entrypoint-initdb.d/15-phase7.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  leads-data:
